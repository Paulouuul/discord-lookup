version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: discord-lookup-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - discord-lookup-network
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: discord-lookup-api
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
    depends_on:
      - redis
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - discord-lookup-network

networks:
  discord-lookup-network:
    driver: bridge

volumes:
  redis_data: