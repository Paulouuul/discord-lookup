[project]
name = "discord-lookup"
version = "1.1.6"
description = "CLI tool and Python library for Discord user lookup"
readme = "README.md"
license = "MIT"  # ← mudar de { text = "MIT" } para "MIT"
authors = [
    { name = "Paulo Ricardo Tebet Lyrio", email = "tebetpaulo91@yahoo.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
    "colorama>=0.4.6",
    "tabulate>=0.9.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0.0",
    "dicttoxml>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
]

[project.urls]
Homepage = "https://github.com/Paulouuul/discord-lookup"
Repository = "https://github.com/Paulouuul/discord-lookup"

[project.scripts]
discord-lookup = "discord_lookup.cli:main"

[tool.setuptools.packages.find]
include = ["discord_lookup*"]
exclude = ["api*", "tests*"]